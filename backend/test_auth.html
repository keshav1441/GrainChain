<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
</head>
<body>
    <h1>Authentication Test</h1>
    <div id="results"></div>
    
    <script>
        async function testAuth() {
            const results = document.getElementById('results');
            
            // Check token
            const token = localStorage.getItem('token');
            results.innerHTML += `<p><strong>Token:</strong> ${token ? 'Present' : 'Missing'}</p>`;
            
            if (!token) {
                results.innerHTML += `<p style="color: red;">No token found. Please login first.</p>`;
                return;
            }
            
            // Decode token payload
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                results.innerHTML += `<p><strong>Token payload:</strong> ${JSON.stringify(payload, null, 2)}</p>`;
                
                // Check if expired
                const currentTime = Math.floor(Date.now() / 1000);
                if (payload.exp && payload.exp < currentTime) {
                    results.innerHTML += `<p style="color: red;">Token is EXPIRED</p>`;
                } else {
                    results.innerHTML += `<p style="color: green;">Token is VALID</p>`;
                }
            } catch (error) {
                results.innerHTML += `<p style="color: red;">Error decoding token: ${error.message}</p>`;
            }
            
            // Test debug endpoint
            try {
                results.innerHTML += `<p><strong>Testing debug endpoint...</strong></p>`;
                const response = await fetch('http://localhost:8000/api/v1/users/debug', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                    },
                });
                
                results.innerHTML += `<p>Debug response status: ${response.status}</p>`;
                
                if (response.ok) {
                    const data = await response.json();
                    results.innerHTML += `<p style="color: green;">Debug success: ${JSON.stringify(data, null, 2)}</p>`;
                } else {
                    const errorText = await response.text();
                    results.innerHTML += `<p style="color: red;">Debug error: ${errorText}</p>`;
                }
            } catch (error) {
                results.innerHTML += `<p style="color: red;">Debug request failed: ${error.message}</p>`;
            }
            
            // Test verification endpoint
            try {
                results.innerHTML += `<p><strong>Testing verification endpoint...</strong></p>`;
                const response = await fetch('http://localhost:8000/api/v1/users/verification/status', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                    },
                });
                
                results.innerHTML += `<p>Verification response status: ${response.status}</p>`;
                
                if (response.ok) {
                    const data = await response.json();
                    results.innerHTML += `<p style="color: green;">Verification success: ${JSON.stringify(data, null, 2)}</p>`;
                } else {
                    const errorText = await response.text();
                    results.innerHTML += `<p style="color: red;">Verification error: ${errorText}</p>`;
                }
            } catch (error) {
                results.innerHTML += `<p style="color: red;">Verification request failed: ${error.message}</p>`;
            }
        }
        
        // Run test when page loads
        testAuth();
    </script>
</body>
</html>
